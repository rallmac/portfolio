services:
  - type: web
    name: reader
    runtime: python
    pythonVersion: 3.13
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT server.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
